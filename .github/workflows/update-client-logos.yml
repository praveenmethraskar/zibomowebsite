name: Update client logos

on:
  push:
    paths:
      - '.github/workflows/update-client-logos.yml'

permissions:
  contents: write

jobs:
  update-client-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download and prepare client logos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/images/clients
          python3 - <<'PY'
          import base64, pathlib, urllib.request

          out = pathlib.Path('assets/images/clients')
          out.mkdir(parents=True, exist_ok=True)

          def download(name, urls):
              last = None
              for url in urls:
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=30) as r:
                          data = r.read()
                      if len(data) < 1000:
                          raise ValueError('download too small')
                      (out / name).write_bytes(data)
                      print(f'{name}: {len(data)} bytes from {url}')
                      return
                  except Exception as e:
                      last = e
                      print(f'Failed {url}: {e}')
              raise RuntimeError(f'Could not download {name}: {last}')

          download('prasads.png', [
              'https://www.joonsquare.com/usermanage/image/business/prasads-multiplex-hyderabad-34123/prasads-multiplex-hyderabad-logo.png',
              'https://pbs.twimg.com/profile_images/1618498239136960513/4cz-Lbb9_400x400.jpg'
          ])
          download('odeon-mall.png', [
              'https://odeonmall.com/wp-content/uploads/2025/04/odeon-mall-Logo-White.png'
          ])
          download('swarnagiri.png', [
              'https://ytdtemple.com/uploads/pooja/84e553725fbb19675c7d4e4bc42f90f3.png',
              'https://ytdtemple.com/front_assets/images/swarngiri_logo.png'
          ])
          download('t-hub.png', [
              'https://t-hub.co/wp-content/uploads/2019/07/thub-logo-3.png',
              'https://t-hub.co/static/relaunch/assets/img/t_hub_logo.png'
          ])

          upzy_b64 = ''''''
          (out / 'upzy.jpg').write_bytes(base64.b64decode(upzy_b64))
          PY

          cp assets/images/partners/South_Central.png assets/images/clients/south-central-railway.png

      - name: Patch only the clients section
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          replacement = '''<section id="clients" class="section section--light"><div class="container"><div class="row tw-justify-center"><div class="col-lg-8 tw-text-center"><span class="sec-kicker" data-reveal="fade-down">Clients</span><h2 class="sec-title" data-reveal="fade-up">Smart Lockers in Action</h2><p class="sec-lead" data-reveal="fade-up" data-reveal-delay="120">Zibomo solutions are deployed across retail, entertainment, religious, technology and public infrastructure environments.</p></div></div><div class="row g-4 tw-mt-4 tw-justify-center">
  <div class="col-6 col-lg-4" data-reveal="fade-up"><div class="client"><img src="assets/images/clients/prasads.png" alt="Prasads Multiplex logo" loading="lazy" style="max-width:160px;max-height:82px;width:auto;height:auto;object-fit:contain;margin-bottom:1rem;"><h3 class="client__name">Prasads Multiplex</h3><p class="client__type">Cinema &amp; Entertainment</p></div></div>
  <div class="col-6 col-lg-4" data-reveal="fade-up" data-reveal-delay="80"><div class="client"><img src="assets/images/clients/odeon-mall.png" alt="Odeon Mall logo" loading="lazy" style="max-width:160px;max-height:82px;width:auto;height:auto;object-fit:contain;margin-bottom:1rem;background:#0A1638;padding:8px 12px;border-radius:8px;"><h3 class="client__name">Odeon Mall</h3><p class="client__type">Retail &amp; Shopping</p></div></div>
  <div class="col-6 col-lg-4" data-reveal="fade-up" data-reveal-delay="160"><div class="client"><img src="assets/images/clients/swarnagiri.png" alt="Swarnagiri Sree Venkateswara Swamy Devasthanam logo" loading="lazy" style="max-width:160px;max-height:82px;width:auto;height:auto;object-fit:contain;margin-bottom:1rem;"><h3 class="client__name">Swarnagiri</h3><p class="client__type">Temple &amp; Visitor Services</p></div></div>
  <div class="col-6 col-lg-4" data-reveal="fade-up"><div class="client"><img src="assets/images/clients/t-hub.png" alt="T-Hub logo" loading="lazy" style="max-width:160px;max-height:82px;width:auto;height:auto;object-fit:contain;margin-bottom:1rem;"><h3 class="client__name">T-Hub</h3><p class="client__type">Innovation &amp; Technology Campus</p></div></div>
  <div class="col-6 col-lg-4" data-reveal="fade-up" data-reveal-delay="80"><div class="client"><img src="assets/images/clients/south-central-railway.png" alt="South Central Railway logo" loading="lazy" style="max-width:160px;max-height:82px;width:auto;height:auto;object-fit:contain;margin-bottom:1rem;"><h3 class="client__name">South Central Railway</h3><p class="client__type">Public Transport Infrastructure</p></div></div>
  <div class="col-6 col-lg-4" data-reveal="fade-up" data-reveal-delay="160"><div class="client"><img src="assets/images/clients/upzy.jpg" alt="Upzy logo" loading="lazy" style="max-width:180px;max-height:82px;width:auto;height:auto;object-fit:contain;margin-bottom:1rem;border-radius:8px;"><h3 class="client__name">Upzy</h3><p class="client__type">Gig Worker Platform</p></div></div>
</div></div></section>'''

          pattern = r'<section id="clients" class="section section--light">.*?</section>'
          updated, count = re.subn(pattern, replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected exactly one clients section, found {count}')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Verify targeted change
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/images/clients/prasads.png' index.html
          grep -q 'assets/images/clients/upzy.jpg' index.html
          grep -q 'id="faq"' index.html
          grep -q 'id="product"' index.html
          test -s assets/images/clients/prasads.png
          test -s assets/images/clients/odeon-mall.png
          test -s assets/images/clients/swarnagiri.png
          test -s assets/images/clients/t-hub.png
          test -s assets/images/clients/south-central-railway.png
          test -s assets/images/clients/upzy.jpg

      - name: Commit logo assets and client section
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/clients/
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Add client logos without changing site structure'
          git push
